# Databricks Job for the PySpark pipeline (Databricks Asset Bundle resource format).
# Runs the four notebooks from the workspace Git folder, each task only after the previous one
# succeeded. Task 14 fails while a correction rejection is open, so the watermark cannot advance.
#
# The UI steps that create the same Job are in pyspark/README.md ("Databricks Job").
resources:
  jobs:
    retail_pyspark_pipeline:
      name: retail_pyspark_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: target_schema
          default: workspace.retail_pipeline_pyspark
        - name: landing_dir
          default: /Volumes/workspace/retail_pipeline_pyspark/landing/incoming
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/${workspace.current_user.userName}/retail-data-engineering-pipeline/pyspark/notebooks/11_pyspark_bronze
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: /Workspace/Users/${workspace.current_user.userName}/retail-data-engineering-pipeline/pyspark/notebooks/12_pyspark_silver
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: /Workspace/Users/${workspace.current_user.userName}/retail-data-engineering-pipeline/pyspark/notebooks/13_pyspark_gold
        - task_key: commit
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: /Workspace/Users/${workspace.current_user.userName}/retail-data-engineering-pipeline/pyspark/notebooks/14_pyspark_commit
      # Optional, add only after a manual run succeeds:
      # trigger:
      #   file_arrival:
      #     url: /Volumes/workspace/retail_pipeline_pyspark/landing/incoming/
