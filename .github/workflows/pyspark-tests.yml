name: pyspark-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pyspark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyspark/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (local Parquet store)
        run: python -m pytest -m "not delta" -q

      - name: Delta Lake tests (real MERGE on local Delta tables)
        env:
          RUN_DELTA_TESTS: "1"
        run: python -m pytest -m delta -q
